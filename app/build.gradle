plugins { id 'com.android.application' }
def legacyConfigMigration = providers.gradleProperty('legacyConfigMigration').isPresent()
android {
    namespace 'io.github.hypernova'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.github.hypernova'
        minSdk 35
        targetSdk 35
        versionCode legacyConfigMigration ? 33 : 35
        versionName legacyConfigMigration ? '0.2.31-migration' : '0.2.31-dev'
        resValue 'string', 'module_version', versionName
        buildConfigField 'boolean', 'LEGACY_CONFIG_MIGRATION', legacyConfigMigration.toString()
    }
    buildFeatures { buildConfig true }
    if (!legacyConfigMigration) sourceSets.main.resources.srcDir('src/modern/resources')
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// This bridge extends a host class. Keep host signature stubs out of both APK DEX files.
def bridgeClasses = layout.buildDirectory.dir('hostBridge/classes')
def bridgeAssets = layout.buildDirectory.dir('generated/hostBridgeAssets')
abstract class DexHostBridgeTask extends JavaExec {
    @org.gradle.api.tasks.OutputDirectory
    abstract org.gradle.api.file.DirectoryProperty getAssetsDirectory()
}
tasks.register('compileHostBridge', JavaCompile) {
    source fileTree('src/hostApi/java'), fileTree('src/hostBridge/java')
    classpath = files()
    destinationDirectory = bridgeClasses
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.encoding = 'UTF-8'
}
def bridgeJar = tasks.register('hostBridgeJar', Jar) {
    dependsOn 'compileHostBridge'
    archiveFileName = 'notification-bridge.jar'
    destinationDirectory = layout.buildDirectory.dir('hostBridge')
    from(bridgeClasses) { include 'io/github/hypernova/bridge/**' }
}
def stubJar = tasks.register('hostApiJar', Jar) {
    dependsOn 'compileHostBridge'
    archiveFileName = 'host-signatures.jar'
    destinationDirectory = layout.buildDirectory.dir('hostBridge')
    from(bridgeClasses) { include 'com/android/systemui/**' }
}
def dexBridge = tasks.register('dexHostBridge', DexHostBridgeTask) {
    dependsOn bridgeJar, stubJar
    classpath = files(new File(android.sdkDirectory, 'build-tools/35.0.0/lib/d8.jar'))
    mainClass = 'com.android.tools.r8.D8'
    inputs.files(bridgeJar.flatMap { it.archiveFile }, stubJar.flatMap { it.archiveFile })
    assetsDirectory.set(bridgeAssets)
    doFirst {
        // Android Components may assign a variant-specific generated directory.
        def generatedAssets = assetsDirectory.get().asFile
        generatedAssets.mkdirs()
        args = ['--min-api', '34', '--lib', new File(android.sdkDirectory, "platforms/android-${android.compileSdk}/android.jar"),
                '--classpath', stubJar.get().archiveFile.get().asFile,
                '--output', generatedAssets, bridgeJar.get().archiveFile.get().asFile]
    }
}
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.sources.assets.addGeneratedSourceDirectory(dexBridge, { task -> task.assetsDirectory })
}
dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly('io.github.libxposed:api:101.0.1') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
    }
    implementation('io.github.libxposed:service:101.0.0') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
    }
    testRuntimeOnly 'de.robv.android.xposed:api:82'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
